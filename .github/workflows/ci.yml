name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/teacherperi_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name teacherperi-ci-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec teacherperi-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec teacherperi-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec teacherperi-ci-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
      - name: Install native MongoDB for local setup smoke test
        run: |
          curl --fail --silent --show-error --location https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-8.0.16.tgz -o "$RUNNER_TEMP/local-mongo.tgz"
          tar -xzf "$RUNNER_TEMP/local-mongo.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mongodb-linux-x86_64-ubuntu2204-8.0.16/bin" >> "$GITHUB_PATH"
      - name: Verify isolated local startup and actual content import
        env:
          MONGO_URI: mongodb://127.0.0.1:27018/teacherperi_dev?directConnection=true
          MONGO_CONTENT_IMPORT_URI: mongodb://127.0.0.1:27018/teacherperi_dev?directConnection=true
          CONTENT_IMPORT_CONFIRM: teacherperi_dev
        run: |
          npm run db:local:start
          npm run db:local:start
          if npm run content:check; then echo "Expected no content before import"; exit 1; fi
          npm run content:import -- --dry-run
          npm run content:import -- --apply
          npm run content:import -- --dry-run
          npm run content:check
      - run: npm run content:validate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
